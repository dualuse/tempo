name: Pages

# Publishes site/ (Tempo Timeline) to this repository's GitHub Pages site, the Tempo-Link base a jar
# built here points at (https://<owner>.github.io/<repo>/). Runs on pushes to the default branch.
# A fork turns on Pages with Source: GitHub Actions and pushes (or runs this workflow by hand);
# while Pages is off or published from a branch, the deploy is skipped with a notice.

on:
  push:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        name: Pages source is GitHub Actions?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = workflow ]; then
            echo enabled=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tempo Timeline not deployed: turn on Pages with Source: GitHub Actions (Settings > Pages) so the Tempo-Link of a jar built here opens a viewer"
            echo enabled=false >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
