name: Pages

# Publishes site/ (Tempo Timeline), and nothing else, to this repository's GitHub Pages site: the
# Tempo-Link base a jar built here points at (https://<owner>.github.io/<repo>/). Nothing in it names
# an owner, a repository or a domain, and the viewer makes its share links from its own address, so a
# fork deploys its own copy unchanged. Runs on pushes to master and by hand. While Pages is off, or
# published from a branch rather than by GitHub Actions, the deploy is skipped with a notice; turn it
# on under Settings > Pages > Source: GitHub Actions.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        name: Pages source is GitHub Actions?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || true)
          if [ "$build_type" = workflow ]; then
            echo enabled=true >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tempo Timeline not deployed: turn on Pages with Source: GitHub Actions (Settings > Pages) so the Tempo-Link of a jar built here opens a viewer"
            echo enabled=false >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
