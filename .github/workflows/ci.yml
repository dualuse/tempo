name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21]
    steps:
      - uses: actions/checkout@v4
      # Gradle 9 needs 17+ to run; the tests run on the matrix JDK through a toolchain.
      # The last version listed becomes JAVA_HOME.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
      # LadderTest checks Java's values and links with the reference (python3) and the viewer's parser (node)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - name: Test on JDK ${{ matrix.java }}
        run: >
          ./gradlew test
          -PtestJdk=${{ matrix.java }}
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64
      - name: Allocation gate on JDK ${{ matrix.java }}
        run: >
          ./gradlew jmhGate
          -PtestJdk=${{ matrix.java }}
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64
      - name: Concurrency tests on JDK ${{ matrix.java }}
        run: >
          ./gradlew jcstress
          -PtestJdk=${{ matrix.java }}
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64
      # The jar links to the GitHub Pages viewer of the repository it is built in (GITHUB_REPOSITORY,
      # which Actions always sets), so a fork's jar opens the fork's viewer (deployed by pages.yml once
      # the fork turns on Pages); the next builds check that rule for a made-up fork and -PlinkBase.
      # The manifest wraps lines at 72 bytes, so continuation lines are joined before the grep.
      - name: Library jar with this repository's Tempo-Link base
        if: matrix.java == 21
        run: |
          ./gradlew jar checkLinkBase
          unzip -p build/libs/tempo-*.jar io/github/dualuse/tempo/link-base.txt
          unzip -p build/libs/tempo-*.jar META-INF/MANIFEST.MF | tr -d '\r' \
            | awk '/^ / { line = line substr($0, 2); next } { if (NR > 1) print line; line = $0 } END { print line }' \
            | grep "^Tempo-Link-Base: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/"
          GITHUB_REPOSITORY=Some-Owner/tempo-fork ./gradlew test --tests '*LinkTest*' jar
          test "$(unzip -p build/libs/tempo-*.jar io/github/dualuse/tempo/link-base.txt)" = "https://some-owner.github.io/tempo-fork/"
          ./gradlew test --tests '*LinkTest*' jar -PlinkBase=https://tempo.example.org/viewer/
          test "$(unzip -p build/libs/tempo-*.jar io/github/dualuse/tempo/link-base.txt)" = "https://tempo.example.org/viewer/"

  # The format's shared tests: the vectors and the ladder against the reference, the CLI (Python 3.8+,
  # stdlib only), the viewer's parser and analysis (Node).
  format:
    name: Format tests (Python ${{ matrix.python }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.x"
            node: 20
          - python: "3.x"
            node: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Golden vectors and samples
        run: python tests/run_golden.py
      - name: Command-line viewer
        run: python -m unittest tests.test_cli
      - name: Private-term check script
        run: python -m unittest tests.test_check_private
      - name: Web viewer parser
        run: |
          node tests/test_parser.mjs
          node tests/test_analysis.mjs
          node tests/check_spa_parser_sync.mjs
      # Every sample in light and dark, at phone and desktop size, through every tab: no console
      # message, no request besides the page, no page wider than the window (ubuntu-latest has Chrome).
      - name: Web viewer in headless Chrome
        if: matrix.node == 22
        run: node tests/check_site_headless.mjs

  # The CLI promises Python 3.8. Current runner images no longer offer 3.8 through setup-python, so
  # this job runs the Python suites in the python:3.8 image (which has git, for the check script).
  python-floor:
    name: Python 3.8 (the CLI's oldest)
    runs-on: ubuntu-latest
    container: python:3.8
    steps:
      - uses: actions/checkout@v4
      - name: Golden vectors, command-line viewer, private-term check script
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python tests/run_golden.py
          python -m unittest tests.test_cli tests.test_check_private

  # Greps the tree and the full history for the deny-list in the TEMPO_DENYLIST secret (one extended
  # regular expression per line), see tools/check-private.sh. Only on pushes to master: secrets are
  # not given to pull requests from forks, and a fork without the secret skips the check.
  private-terms:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Private terms in the tree and the history
        env:
          DENYLIST: ${{ secrets.TEMPO_DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then
            echo "::notice::Private-term check skipped: no TEMPO_DENYLIST secret"
            exit 0
          fi
          list=$(mktemp)
          printf '%s\n' "$DENYLIST" > "$list"
          TEMPO_DENYLIST="$list" tools/check-private.sh --names-only
