name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21]
    steps:
      - uses: actions/checkout@v4
      # Gradle 9 needs 17+ to run; the tests run on the matrix JDK through a toolchain.
      # The last version listed becomes JAVA_HOME.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test on JDK ${{ matrix.java }}
        run: >
          ./gradlew test
          -PtestJdk=${{ matrix.java }}
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64
      - name: Allocation gate on JDK ${{ matrix.java }}
        run: >
          ./gradlew jmhGate
          -PtestJdk=${{ matrix.java }}
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64
      - name: Concurrency tests on JDK ${{ matrix.java }}
        run: >
          ./gradlew jcstress
          -PtestJdk=${{ matrix.java }}
          -Porg.gradle.java.installations.auto-download=false
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64
      # The jar links to the GitHub Pages viewer of the repository it is built in (GITHUB_REPOSITORY),
      # so a fork's jar opens the fork's viewer (deployed by pages.yml once the fork turns on Pages);
      # the second build checks that rule for a made-up fork.
      - name: Library jar with this repository's Tempo-Link base
        if: matrix.java == 21
        run: |
          ./gradlew jar checkLinkBase
          unzip -p build/libs/tempo-*.jar io/github/dualuse/tempo/link-base.txt
          GITHUB_REPOSITORY=Some-Owner/tempo-fork ./gradlew test --tests '*LinkTest*' jar
          test "$(unzip -p build/libs/tempo-*.jar io/github/dualuse/tempo/link-base.txt)" = "https://some-owner.github.io/tempo-fork/"
